<text x="104" y="1361" text-anchor="start">TOP (m_crc_engine) frame</text>
<rect x="430" y="1336" width="1480" height="36" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="434" y="1361" text-anchor="start">The generator and checker process separate frames concurrently. Each channel contains one instance of the selected CRC method.</text>
<rect x="1910" y="1336" width="230" height="36" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="1914" y="1361" text-anchor="start">Sections 5.1, 14.2</text>
<rect x="2140" y="1336" width="360" height="36" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="2144" y="1361" text-anchor="start">GIN, GOUT, CIN, COUT, CLKRS</text>
<rect x="100" y="1372" width="330" height="36" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="104" y="1397" text-anchor="start">u_crc_gen (m_crc_gen)</text>
<rect x="430" y="1372" width="1480" height="36" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="434" y="1397" text-anchor="start">Accumulates one frame and returns its finalized CRC using the selected method.</text>
<rect x="1910" y="1372" width="230" height="36" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="1914" y="1397" text-anchor="start">Section 14.2</text>
<rect x="2140" y="1372" width="360" height="36" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="2144" y="1397" text-anchor="start">GIN, GOUT, CLKRS</text>
<rect x="100" y="1408" width="330" height="36" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="104" y="1433" text-anchor="start">u_crc_check (m_crc_check)</text>
<rect x="430" y="1408" width="1480" height="36" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="434" y="1433" text-anchor="start">Accumulates a separate frame, compares its finalized CRC with the final-beat reference, and reports pass or fail.</text>
<rect x="1910" y="1408" width="230" height="36" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
