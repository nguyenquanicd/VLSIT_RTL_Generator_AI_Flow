<text x="284" y="1950" text-anchor="start">Interface connector (one per signal group; arrow = active to passive)</text>
<text x="104" y="2025" text-anchor="start">The enclosing frame is m_crc_engine. Each child wrapper instantiates one copy of the selected method.</text>
