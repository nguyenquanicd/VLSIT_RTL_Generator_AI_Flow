<text x="12" y="500" font-size="11" fill="#444">The read data strobe stops after two words. After t_tmo CK periods CS# goes high, the AXI request ends with SLVERR, the log is captured and hr_sts.hold = 1. Software reads hr_tmo_log and hr_tmo_addr and writes hr_ctrl.resume. Symbolic timing.</text>
