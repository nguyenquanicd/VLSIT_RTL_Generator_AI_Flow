<text x="700" y="558" text-anchor="middle">(m_vlsit_apbcdc_mst)</text>
<rect x="930" y="660" width="260" height="60" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
<text x="1060" y="686" text-anchor="middle">u_vlsit_apbcdc_slv</text>
<text x="1060" y="708" text-anchor="middle">(m_vlsit_apbcdc_slv)</text>
<text x="1380" y="686" text-anchor="middle">APS</text>
<text x="1380" y="708" text-anchor="middle">completer-side APB</text>
<text x="1208" y="451" text-anchor="end">TOP</text>
<text x="1208" y="473" text-anchor="end">(m_vlsit_async_apb_bridge)</text>
<text x="855" y="526" text-anchor="middle">REQ</text>
<text x="705" y="718" text-anchor="middle">RSP</text>
<text x="104" y="2237" text-anchor="start" font-weight="bold">Legend</text>
<text x="284" y="2278" text-anchor="start">Interface connector (one per signal group; arrow = active to passive)</text>
<text x="104" y="2353" text-anchor="start">The enclosing frame is the top module; blocks inside are its instances. The two clocks are asynchronous. Only the control bits pass through synchronizers inside the two blocks; the bundles are timed paths.</text>
<text x="380" y="536" text-anchor="middle">APM</text>
<text x="380" y="558" text-anchor="middle">requester-side APB</text>
<text x="700" y="331" text-anchor="middle">CRMST</text>
<text x="700" y="353" text-anchor="middle">i_clk_mst, i_rst_n_mst</text>
<text x="1060" y="831" text-anchor="middle">CRSLV</text>
<text x="1060" y="853" text-anchor="middle">i_clk_slv, i_rst_n_slv</text>
<rect x="100" y="1090" width="2400" height="338" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
<text x="1300" y="1117" text-anchor="middle" font-weight="bold">Block Functions &amp; Interfaces</text>
<rect x="100" y="1130" width="330" height="36" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="104" y="1155" text-anchor="start" font-weight="bold">Block</text>
<rect x="430" y="1130" width="1480" height="36" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="434" y="1155" text-anchor="start" font-weight="bold">Function</text>
<rect x="1910" y="1130" width="230" height="36" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="1914" y="1155" text-anchor="start" font-weight="bold">Source</text>
<rect x="2140" y="1130" width="360" height="36" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="2144" y="1155" text-anchor="start" font-weight="bold">Interfaces (mnemonics)</text>
<rect x="100" y="1166" width="330" height="58" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="104" y="1191" text-anchor="start">TOP (m_vlsit_async_apb_bridge)</text>
<text x="104" y="1213" text-anchor="start">frame</text>
<rect x="430" y="1166" width="1480" height="58" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="434" y="1180" text-anchor="start">Structural top of the asynchronous APB bridge. It joins the requester-side block and the completer-side block and holds no logic of its own. One</text>
<text x="434" y="1202" text-anchor="start">APB transfer crosses the clock boundary as a request bundle and a response bundle; only the request and acknowledge control bits pass through</text>
<text x="434" y="1224" text-anchor="start">synchronizers.</text>
<rect x="1910" y="1166" width="230" height="58" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="1914" y="1202" text-anchor="start">Section 14.2</text>
<rect x="2140" y="1166" width="360" height="58" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="2144" y="1202" text-anchor="start">APM, APS, CRMST, CRSLV</text>
<rect x="100" y="1224" width="330" height="102" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="104" y="1271" text-anchor="start">u_vlsit_apbcdc_mst</text>
<text x="104" y="1293" text-anchor="start">(m_vlsit_apbcdc_mst)</text>
<rect x="430" y="1224" width="1480" height="102" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="434" y="1249" text-anchor="start">APB completer of the requester side, in the requester clock domain. It captures the Setup phase of a transfer into a hold register, launches the</text>
<text x="434" y="1271" text-anchor="start">request control bit (a toggle in the two-phase handshake, a level in the four-phase handshake), keeps the response-ready output low until the</text>
<text x="434" y="1293" text-anchor="start">answer is available, then loads the response bundle and raises the ready output for one cycle. It receives the acknowledge control bit through a</text>
<text x="434" y="1315" text-anchor="start">synchronizer and passes the optional wake-up indication on to the other side.</text>
<rect x="1910" y="1224" width="230" height="102" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="1914" y="1282" text-anchor="start">Section 14.2</text>
<rect x="2140" y="1224" width="360" height="102" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="2144" y="1282" text-anchor="start">REQ, RSP, APM, CRMST</text>
<rect x="100" y="1326" width="330" height="102" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="104" y="1373" text-anchor="start">u_vlsit_apbcdc_slv</text>
<text x="104" y="1395" text-anchor="start">(m_vlsit_apbcdc_slv)</text>
<rect x="430" y="1326" width="1480" height="102" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="434" y="1351" text-anchor="start">APB requester of the completer side, in the completer clock domain. It receives the request control bit and the wake-up indication through</text>
<text x="434" y="1373" text-anchor="start">synchronizers, loads the request bundle into a payload register, drives one APB transfer to the external completer, captures the response into a</text>
<text x="434" y="1395" text-anchor="start">hold register, and launches the acknowledge control bit. The request and response bundles are stable for the whole handshake, so they cross as</text>
<text x="434" y="1417" text-anchor="start">timed paths without synchronizers.</text>
<rect x="1910" y="1326" width="230" height="102" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="1914" y="1384" text-anchor="start">Section 14.2</text>
<rect x="2140" y="1326" width="360" height="102" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="2144" y="1384" text-anchor="start">REQ, RSP, APS, CRSLV</text>
